name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore ValorantReplayParser.sln
      - run: dotnet build ValorantReplayParser.sln -c Release --no-restore
      - run: dotnet test ValorantReplayParser.sln -c Release --no-build --no-restore
